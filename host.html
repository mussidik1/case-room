<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security policy: only this site's own scripts run, and the page can only talk to the game relays
     (plus a local test relay). Keep it the first tag in <head>. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884 wss://mqtt.eclipseprojects.io ws://localhost:8883 ws://127.0.0.1:8883; worker-src blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Case Room · DM Screen</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/cardo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cardo-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/host.css">
</head>
<body class="host">
<header class="bar">
  <div class="brand"><span class="brand-d20" aria-hidden="true">⬢</span>CASE ROOM <span class="case-title" id="barTitle"></span></div>
  <div class="bar-mid" id="barStep"></div>
  <div class="bar-right">
    <span class="chip join" id="barJoin" hidden></span>
    <span class="chip people" id="barParty" hidden></span>
    <span class="dot idle" id="barNet" title="Connection"></span>
    <button type="button" class="icon" id="btnRoll" title="Call for a roll (R)" hidden>🎲</button>
    <button type="button" class="icon" id="btnSettings" title="Settings">⚙︎</button>
    <button type="button" class="icon" id="btnFull" title="Full screen (F)">⛶</button>
  </div>
</header>
<main>
  <section id="vSetup" class="view"></section>
  <section id="vLobby" class="view" hidden></section>
  <section id="vGame" class="view" hidden>
    <div class="stage-left" id="left"></div>
    <div class="stage-right"><div class="hp" id="hp"></div><div id="monitor"></div></div>
  </section>
  <section id="vFinal" class="view" hidden></section>
</main>
<footer class="ctl"><span class="hint" id="hint"></span><button type="button" class="next" id="btnNext">Next ▸</button></footer>
<div class="modal" id="mRoll" hidden></div>
<div class="modal" id="mSettings" hidden></div>
<script src="vendor/mqtt.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/rules.js"></script>
<script src="js/ecg.js"></script>
<script src="js/monitor.js"></script>
<script src="js/net.js"></script>
<script src="js/topics.js"></script>
<!-- Cases live in js/cases/<registry topic>/<adult|pediatric>/. Add a line here for each new case. -->
<script src="js/cases/airway/adult/third-floor.js"></script>
<script src="js/cases/cardiology/adult/kitchen-table.js"></script>
<script src="js/cases/cardiology/adult/match-point.js"></script>
<script src="js/cases/medical/adult/words-wont-come.js"></script>
<script src="js/cases/trauma/adult/down-at-the-barrier.js"></script>
<script src="js/cases/medical/pediatric/birthday-party.js"></script>
<script src="js/host.js"></script>
</body>
</html>
